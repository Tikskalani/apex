name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Lint (errors only)
        run: python -m ruff check --select F,E9 agent_server.py apex_engine.py apex_domains.py apex_apply.py apex_store.py tools tests
      - name: Regression suites
        run: python tests/run_all.py
      - name: Unit, API, security and browser tests (offline model stub, saved job postings)
        run: python -m pytest -q -p no:cacheprovider
